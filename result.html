<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./css/result.css">
</head>
<body>
  <div class="detail">  
    <h2 class="title">
        結果発表
    </h2>

 <!-- ユーザー情報セクション -->
    <div class="username1">
        <h1>こんにちは、<span id="username">ゲスト</span>さん！</h1>
        <button id="logoutBtn">ログアウト</button>
    </div>
    <script src="./javascript/login_2.js"></script>


      <p class="category">
        <span class="home"><a href="home.html">ホーム</a></span>
        <span class="login"><a href="login.html">ログイン</a></span>
        <span class="contact"><a href="">お問合せ</a></span>
      </p>
  </div>
    
  <div class="introduction">

     </p>
 </div>

    </div>

    
</div>
<div class="btn">
     <button id="resetButton">スコアリセット</button>
     <!--ホームに戻る -->
   <p class="homebtn"><a href="home.html">ホームに戻る</a></p>
</div>

</html>
