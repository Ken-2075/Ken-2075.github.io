<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録</title>
    <link rel="stylesheet" href="./css/newuser.css">
</head>
<body>

  <div class="detail">  
    <h2 class="title">
        新規登録画面
    </h2>

    <p class="category">
      <span class="home"><a href="home.html">ホーム</a></span>
      <span class="login"><a href="login.html">ログイン</a></span>
      <span class="contact"><a href="">お問合せ</a></span>
    </p>
  </div>

  <div class="introduction">
     <p>
        新規登録ページです。
        <br>
        「ユーザー名」と「パスワード」を登録してください。
        <br>
     </p>
  </div>

  <form id="registerForm">
      <!-- 名前 -->
      <div class="form-group">
        <label for="name">ユーザー名</label>
        <input type="text" id="name" name="name" placeholder="ユーザー名を入力" required>
      </div>

      <!-- パスワード -->
      <div class="form-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" placeholder="パスワードを入力" required>
      </div>

      <!-- パスワード確認 -->
      <div class="form-group">
        <label for="confirm-password">パスワード確認</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="もう一度パスワードを入力" required>
      </div>

      <!-- 新規登録ボタン -->
      <button type="button" onclick="registerUser()">新規登録</button>
  </form>

  <script src="./javascript/newuser.js"></script>

</body>
</html>
